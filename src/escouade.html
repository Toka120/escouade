<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escouade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 34 34%27%3E%3Cpath d=%27M17 2 L30 7 V16 C30 24 24 29.5 17 32 C10 29.5 4 24 4 16 V7 Z%27 fill=%27%23151b29%27 stroke=%27%23e6bb52%27 stroke-width=%272%27/%3E%3Cpath d=%27M10 14 L17 10 L24 14 M10 19 L17 15 L24 19 M10 24 L17 20 L24 24%27 fill=%27none%27 stroke=%27%23e6bb52%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Palette : bleu nuit de bannière + or d'insigne. Layout : barre latérale d'onglets + espace de travail. */
:root{
  --bg:#eceff5; --surface:#ffffff; --surface-2:#f4f6fa; --ink:#18203a; --muted:#596381; --line:#d6dbe6;
  --gold:#8f6400; --gold-soft:#f4e7c3; --blue:#23508c; --blue-soft:#dfe8f5;
  --ok:#1d7448; --ok-soft:#d9efe3; --warn:#9a5600; --warn-soft:#fbead2; --bad:#ae2a22; --bad-soft:#f8dedb;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d111b; --surface:#151b29; --surface-2:#1b2233; --ink:#e6e9f1; --muted:#98a2ba; --line:#2a3349;
    --gold:#e6bb52; --gold-soft:#372c12; --blue:#93b6ea; --blue-soft:#1c2a44;
    --ok:#63cf98; --ok-soft:#15301f; --warn:#f0a94a; --warn-soft:#3a2810; --bad:#f08178; --bad-soft:#3a1714;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d111b; --surface:#151b29; --surface-2:#1b2233; --ink:#e6e9f1; --muted:#98a2ba; --line:#2a3349;
  --gold:#e6bb52; --gold-soft:#372c12; --blue:#93b6ea; --blue-soft:#1c2a44;
  --ok:#63cf98; --ok-soft:#15301f; --warn:#f0a94a; --warn-soft:#3a2810; --bad:#f08178; --bad-soft:#3a1714;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px}
h2{font-size:17px}
h3{font-size:15px}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,td.num,.tab{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{flex:none}
.brand strong{font-family:var(--display);font-size:16px;display:block;line-height:1.15}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600}
nav a:hover{background:var(--surface-2)}
nav a.on{background:var(--blue-soft);color:var(--blue)}
nav a .badge{font-size:12px;font-weight:600;color:var(--muted)}
nav a .badge.new{background:var(--gold);color:var(--surface);padding:1px 7px;border-radius:99px}
nav a.on .badge{color:var(--blue)}
.sync{margin-top:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card > h2{margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card > h2 small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.tile .label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .big{font-size:26px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .sub{font-size:13px;color:var(--muted)}
.tile.gold{border-top:3px solid var(--gold)}
.tile.blue{border-top:3px solid var(--blue)}
.tile.ok{border-top:3px solid var(--ok)}
.tile.warn{border-top:3px solid var(--warn)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--gold);border-radius:99px}
.bar.blue > i{background:var(--blue)}
.neg{color:var(--bad)} .pos{color:var(--ok)}

.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.lvl{font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:center;padding:2px 6px;border-radius:6px;background:var(--gold-soft);color:var(--gold);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:10px 2px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08);color:var(--surface)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:26px;height:26px;line-height:1;cursor:pointer;font-weight:700}
.icon-btn:hover{border-color:var(--blue);color:var(--blue)}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.pill.st-fait{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.st-succes{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
.form{display:grid;gap:12px;align-items:end}
.form.f5{grid-template-columns:1.1fr 2fr 1.2fr 1fr auto}
.form.f6{grid-template-columns:1fr 2fr .8fr .8fr 1fr auto}
.form.f4{grid-template-columns:2fr 1fr 2fr auto}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td .sub{display:block;font-size:12px;color:var(--muted)}
tr.here td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tr.done td{color:var(--muted)}
tr.done td strong{text-decoration:line-through;text-decoration-color:var(--line)}
td input[type=text]{padding:5px 8px;font-size:13px}
td.runs{white-space:nowrap}
td.runs span{display:inline-block;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.posbtn{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.posbtn:hover{border-color:var(--gold);color:var(--gold)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters label.f{min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 12px;font-weight:600;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--blue-soft);color:var(--blue)}

.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hbar .track i{display:block;height:100%;background:var(--blue)}
.hbar .track i.out{background:var(--bad)}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums}

.chart svg{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--line)}
.chart .grid-l{stroke:var(--line);stroke-dasharray:3 4}
.chart .line{fill:none;stroke:var(--gold);stroke-width:2.5}
.chart .area{fill:var(--gold-soft);opacity:.7}
.chart .pt{fill:var(--surface);stroke:var(--gold);stroke-width:2}
.chart .pt.last{fill:var(--gold)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

.calc-out{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.calc-out div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.calc-out b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.calc-out span{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.note{font-size:12px;color:var(--muted);margin-top:10px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

.steps .step{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.steps .step input{margin-top:4px}
.steps .step.done{opacity:.7}
.steps .step.done .t{text-decoration:line-through;text-decoration-color:var(--muted)}
.step-h{display:block;cursor:pointer;margin-bottom:6px}
.step-n{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-right:4px}
.step .t{font-weight:700}
.step .s{margin:6px 0 0;font-size:13px;color:var(--muted)}
.step .s b{color:var(--ink);font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums}
a.dchip:hover{border-color:var(--blue);color:var(--blue)}
.dchip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.guide-link{font-size:13px;font-weight:600;white-space:nowrap}
.elem{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.elem div{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px}
.elem b{display:block;color:var(--ink)}
.elem span{color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.links a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:var(--surface-2)}
.links a b{display:block;color:var(--ink)}
.links a span{font-size:12px;color:var(--muted)}
.links a:hover{border-color:var(--blue)}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form.f5,.form.f6{grid-template-columns:1fr 1fr}
  .form.f4{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:5;padding:10px 12px;gap:8px;border-right:none;border-bottom:1px solid var(--line)}
  .brand span{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  nav a{white-space:nowrap;padding:6px 10px}
  nav a .badge{display:none}
  .sync{margin-top:0}
  .g2,.g3{grid-template-columns:1fr}
  .calc-out{grid-template-columns:1fr}
  .hbar{grid-template-columns:110px 1fr 90px}
  .links{grid-template-columns:1fr}
  h1{font-size:23px}
}
@media (max-width:420px){
  .g4{grid-template-columns:1fr}
  .form.f5,.form.f6,.form.f4{grid-template-columns:1fr}
}
</style>
</head>

<div class="app">
  <aside class="side">

        <path d="M17 2 L30 7 V16 C30 24 24 29.5 17 32 C10 29.5 4 24 4 16 V7 Z" fill="var(--blue-soft)" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M10 14 L17 10 L24 14 M10 19 L17 15 L24 19 M10 24 L17 20 L24 24" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function merge(saved){
  const d = defaultState();
  if (!saved || typeof saved !== "object") return d;
  const out = Object.assign(d, saved);
  for (const k of ["perso","xp","kamas","notes","ui","settings"]) out[k] = Object.assign(defaultState()[k], saved[k] || {});
  out.stuff = Object.assign(defaultState().stuff, saved.stuff || {});
  if (!Array.isArray(out.stuff.slots) || !out.stuff.slots.length) out.stuff.slots = defaultState().stuff.slots;
  out.stuff.caracs = out.stuff.caracs || {};
  for (const k of ["sessions","objectifs","customDonjons"]) if (!Array.isArray(out[k])) out[k] = [];
  if (!Array.isArray(out.kamas.ops)) out.kamas.ops = [];
  if (!out.donjons || typeof out.donjons !== "object") out.donjons = {};
  if (!out.parcours || typeof out.parcours !== "object") out.parcours = {};
  if ((saved.v || 1) < 2) {
    for (const [a,b] of Object.entries(RENAMES)) if (out.donjons[a] && !out.donjons[b]) { out.donjons[b] = out.donjons[a]; delete out.donjons[a]; }
    const untouched = out.objectifs.length === OLD_PRESETS.length && out.objectifs.every(o => OLD_PRESETS.includes(o.titre) && !o.fait);
    if (untouched) out.objectifs = presets();
    out.v = 2;
  }
  return out;
}

/* ---------- Utilitaires ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("fr-FR");
const fmt = n => nf.format(Math.round(n || 0));
const fmtK = n => fmt(n) + " K";
function shortK(n){
  const a = Math.abs(n), s = n < 0 ? "−" : "";
  if (a >= 1e6) return s + (a/1e6).toLocaleString("fr-FR",{maximumFractionDigits:2}) + " M";
  if (a >= 1e3) return s + (a/1e3).toLocaleString("fr-FR",{maximumFractionDigits:1}) + " k";
  return s + fmt(a);
}
function parseK(v){
  if (typeof v === "number") return v;
  let s = String(v || "").toLowerCase().replace(/\s| | /g,"").replace(/k$|kamas$/, m => m === "k" ? "k" : "");
  let mult = 1;
  if (/m$/.test(s)) { mult = 1e6; s = s.slice(0,-1); }
  else if (/k$/.test(s)) { mult = 1e3; s = s.slice(0,-1); }
  const n = parseFloat(s.replace(",", "."));
  return isFinite(n) ? Math.round(n * mult) : 0;
}
function getPath(o, p){ return p.split(".").reduce((a,k) => a == null ? a : a[k], o); }
function setPath(o, p, v){
  const ks = p.split("."); let a = o;
  for (let i = 0; i < ks.length - 1; i++){ if (a[ks[i]] == null) a[ks[i]] = {}; a = a[ks[i]]; }
  a[ks[ks.length-1]] = v;
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast("Copié : " + (txt.length > 40 ? "tes données" : txt)); return true; }
  catch(e){ toast("Copie refusée par le navigateur"); return false; }
}

function soldeKamas(){ return state.kamas.depart + state.kamas.ops.reduce((s,o) => s + o.montant, 0); }
function stuffAcheter(){ return state.stuff.slots.filter(s => s.statut === "acheter").reduce((s,x) => s + (x.prix||0), 0); }
function aMonNiveau(d){ const n = state.perso.niveau; return d.lvl >= n - 10 && d.lvl <= n + 10; }
function xpCalc(){
  const x = state.xp, reste = Math.max(0, (x.prochain||0) - (x.courante||0));
  const combats = x.parCombat > 0 ? Math.ceil(reste / x.parCombat) : null;
  const minutes = combats != null ? combats * (x.minCombat || 0) : null;
  return { reste, combats, minutes };
}
const fmtMin = m => m == null ? "—" : m < 60 ? m + " min" : Math.floor(m/60) + " h " + String(m%60).padStart(2,"0");

/* ---------- Sauvegarde ---------- */
const LS_KEY = "carnet-xelor-v1";
let state = defaultState();
let dbRef = null, saving = false, pending = false, saveTimer = null, cloudReady = false;
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = merge(JSON.parse(raw)); } catch(e){}

function setSync(kind){
  const el = document.getElementById("sync");
  const m = {
    loading:["", "Connexion à ta sauvegarde…"],
    cloud:["ok", "Sauvegardé sur ton compte"],
    saving:["warn", "Enregistrement…"],
    local:["warn", "Sauvegarde sur cet appareil uniquement"],
    error:["bad", "Échec de la sauvegarde, réessai à la prochaine modif"]
  }[kind];
  el.innerHTML = `<span class="dot ${m[0]}"></span><span>${m[1]}</span>`;
}
function persist(){
  state.updated = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  if (!dbRef) { setSync("local"); return; }
  setSync("saving");
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!dbRef) return;
  if (saving) { pending = true; return; }
  saving = true;
  try { await dbRef.set({ json: JSON.stringify(state), updated: state.updated }); setSync("cloud"); }
  catch(e){ if (e && e.code === "unavailable") { setTimeout(flush, 1500 + Math.random()*1000); } else setSync("error"); }
  saving = false;
  if (pending) { pending = false; flush(); }
}
async function initCloud(){
  setSync("loading");
  const timer = setTimeout(() => { if (!cloudReady) setSync("local"); }, 10000);
  try {
    if (!window.claude || typeof window.claude.use !== "function") { clearTimeout(timer); setSync("local"); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = user ? await user.id() : null;
    if (!db || !id) { clearTimeout(timer); setSync("local"); return; }
    const ref = db.doc("data/users/" + id + "/carnet");
    const snap = await ref.get();
    clearTimeout(timer);
    dbRef = ref; cloudReady = true;
    if (snap.exists) {
      const body = snap.data();
      let cloud = null; try { cloud = JSON.parse(body.json); } catch(e){}
      if (cloud && (cloud.updated || 0) >= (state.updated || 0)) {
        state = merge(cloud);
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
        render(); setSync("cloud"); return;
      }
    }
    if (!state.updated) state.updated = Date.now();
    await flush();
  } catch(e){ clearTimeout(timer); dbRef = null; setSync("local"); }
}

function levelChart(){
  const pts = state.sessions.filter(s => s.niveauFin).slice().sort((a,b) => (a.date||"").localeCompare(b.date||""));
  if (pts.length < 2) return `<p class="empty">Le graphique apparaît après 2 sessions enregistrées.</p>`;
  const W = 640, H = 200, L = 36, R = 14, T = 14, B = 26;
  const lv = pts.map(p => p.niveauFin), mn = Math.min(...lv) - 1, mx = Math.max(...lv) + 1;
  const x = i => L + (W-L-R) * (pts.length === 1 ? 0 : i/(pts.length-1));
  const y = v => T + (H-T-B) * (1 - (v-mn)/(mx-mn));
  const line = pts.map((p,i) => `${x(i).toFixed(1)},${y(p.niveauFin).toFixed(1)}`).join(" ");
  const area = `${L},${H-B} ${line} ${x(pts.length-1).toFixed(1)},${H-B}`;
  const ticks = [mn+1, Math.round((mn+mx)/2), mx-1].filter((v,i,a) => a.indexOf(v) === i);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du niveau par session">
    ${ticks.map(t => `<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join("")}
    <line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    <polygon class="area" points="${area}"/><polyline class="line" points="${line}"/>
    ${pts.map((p,i) => `<circle class="pt ${i===pts.length-1?"last":""}" cx="${x(i)}" cy="${y(p.niveauFin)}" r="${i===pts.length-1?5:3.5}"/>`).join("")}
    <text x="${L}" y="${H-8}">${esc(pts[0].date)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${esc(pts[pts.length-1].date)}</text>
  </svg></div>`;
}

    <div style="margin-top:14px">${levelChart()}</div>
    ${sess.length ? `<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Date</th><th>Activité</th><th>Durée</th><th>Niveau</th><th>Kamas</th><th></th></tr></thead><tbody>

function vDonjons(){
  const u = state.ui, n = state.perso.niveau, all = allDonjons(), q = (u.djQ||"").toLowerCase().trim();
  const tranches = [["moi",`Mon niveau (${n-10}–${n+10})`],["tous","Tous"],["1-50","1–50"],["51-100","51–100"],["101-150","101–150"],["151-200","151–200"]];
  const list = all.filter(d => {
    if (u.djTranche === "moi" && !aMonNiveau(d)) return false;
    if (/^\d+-\d+$/.test(u.djTranche)) { const [a,b] = u.djTranche.split("-").map(Number); if (d.lvl < a || d.lvl > b) return false; }
    const st = djState(d.boss).etat;
    if (u.djEtat === "afaire" && st) return false;
    if (u.djEtat === "fait" && !st) return false;
    if (q && !(d.boss + " " + d.donjon + " " + d.zone).toLowerCase().includes(q)) return false;
    return true;

function vKamas(){

/* ---------- Paramètres et mises à jour ---------- */
let desktop = false;              // vrai dans l'application Windows (Neutralino) une fois connectée
let upd = { state:"idle", info:null, err:"" };
function curVersion(){ return (desktop && window.NL_APPVERSION) || APP_VERSION; }
function cmpVer(a,b){ const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i=0;i<3;i++){ const d=(x[i]||0)-(y[i]||0); if (d) return d>0?1:-1; } return 0; }
async function checkUpdate(){
  if (!desktop) return;
  upd = { state:"checking", info:null, err:"" }; refreshUpd();
  try {
    const m = await Neutralino.updater.checkForUpdates(UPDATE_URL);
    upd = (m && m.version && cmpVer(m.version, curVersion()) > 0) ? { state:"available", info:m, err:"" } : { state:"uptodate", info:m, err:"" };
  } catch(e){ upd = { state:"error", info:null, err:(e && (e.message || e.code)) || "inconnue" }; }
  refreshUpd();
}
async function installUpdate(){
  if (!desktop || upd.state !== "available") return;
  upd.state = "installing"; refreshUpd();
  try { await Neutralino.updater.install(); upd.state = "restarting"; refreshUpd(); setTimeout(() => { Promise.resolve().then(() => Neutralino.app.restartProcess()).catch(() => { upd.state = "manual"; refreshUpd(); }); }, 600); }
  catch(e){ upd = { state:"error", info:upd.info, err:(e && (e.message || e.code)) || "inconnue" }; refreshUpd(); }
}
function refreshUpd(){ renderNav(); if (current() === "parametres") render(); }
function updPanel(){
  if (!desktop) return `<p style="margin:0">Tu utilises la version en ligne : elle est toujours à jour, il n'y a rien à installer.</p>
    <p class="hint">Les mises à jour depuis cet écran concernent l'application Windows (Escouade.exe).</p>`;
  const v = upd.info && upd.info.version, notes = upd.info && upd.info.data && upd.info.data.notes;
  const msg = {
    idle:`<p class="hint">Clique sur le bouton pour vérifier s'il existe une nouvelle version.</p>`,
    checking:`<p class="hint">Recherche en cours…</p>`,
    uptodate:`<p class="pill st-fait" style="cursor:default">Escouade est à jour</p>`,
    available:`<div class="row" style="background:var(--gold-soft);border-color:transparent;margin-top:10px"><div class="grow"><div class="t">Version ${esc(v)} disponible</div>${notes?`<div class="s" style="color:var(--ink)">${esc(notes)}</div>`:""}</div><button class="btn primary" data-act="upd-install">Installer et redémarrer</button></div>`,
    installing:`<p class="hint">Téléchargement et installation…</p>`,
    restarting:`<p class="hint">Mise à jour installée, redémarrage…</p>`,
    manual:`<p class="hint">Mise à jour installée. Ferme puis relance Escouade pour l'utiliser.</p>`,
    error:`<p class="hint neg">La vérification a échoué (${esc(upd.err)}). Vérifie ta connexion internet puis réessaie.</p>`
  }[upd.state];
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn" data-act="upd-check" ${["checking","installing","restarting","manual"].includes(upd.state)?"disabled":""}>Rechercher une mise à jour</button>
      <label class="check"><input type="checkbox" id="set-auto" data-bind="settings.autoUpdate" data-type="bool" ${state.settings.autoUpdate?"checked":""}> Vérifier au démarrage</label>
    </div>${msg}`;
}

  return head("Paramètres", "Paramètres", "Version de l'application, mises à jour et sauvegarde de tes données.") + `
  <div class="grid g2">
    <section class="card tile blue"><div class="label">Version installée</div><div class="big">${esc(curVersion())}</div><div class="sub">${desktop ? "Application Windows" : "Version en ligne"}</div></section>
    <section class="card"><h2>Mises à jour</h2>${updPanel()}</section>
  </div>
  <section class="card" style="margin-top:16px"><h2>Sauvegarde et transfert</h2>
    <p class="hint" style="margin-top:0">Ton carnet est enregistré sur ton compte quand c'est possible. Tu peux aussi copier toutes tes données pour les garder à part, puis les recoller ici.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="btn" data-act="export">Copier mes données</button><button class="btn" data-act="import">Importer depuis le texte ci-dessous</button>
    <button class="btn danger" data-act="reset" id="btn-reset">Tout remettre à zéro</button></div>
    <label class="f" for="imp">Données à importer</label><textarea id="imp" placeholder="Colle ici le texte copié avec « Copier mes données »" style="min-height:80px"></textarea>
  </section>`;
}

/* ---------- Événements ---------- */
const main = document.getElementById("main");
function coerce(el, raw){
  const t = el.dataset.type;
  if (t === "bool") return !!el.checked;
  if (t === "int") return raw === "" ? "" : (parseInt(raw,10) || 0);
  if (t === "float") return parseFloat(String(raw).replace(",", ".")) || 0;
  if (t === "k") return parseK(raw);
  return raw;
}
main.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.djnote !== undefined) {
    const k = el.dataset.djnote; state.donjons[k] = Object.assign(djState(k), { note: el.value }); persist(); return;
  }
  if (!el.dataset.bind || el.dataset.live) return;
  let v = coerce(el, el.value);
  if (el.dataset.bind === "perso.niveau" || el.dataset.bind === "perso.objectif") v = Math.min(200, Math.max(1, v || 1));
  setPath(state, el.dataset.bind, v);
  persist(); render();
});
main.addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset.bind || !el.dataset.live) return;
  setPath(state, el.dataset.bind, el.value);
  if (el.dataset.live === "search") {
    clearTimeout(main._q); main._q = setTimeout(() => { persist(); render(); const q = document.getElementById("dj-q"); if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250);
  } else { clearTimeout(main._n); main._n = setTimeout(persist, 600); }
});
main.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  const kind = f.dataset.form;
  if (kind === "session") {
    const kam = parseK(d.kamas), niv = parseInt(d.niveauFin,10) || null;
    const s = { id:uid(), date:d.date, activite:d.activite.trim(), duree:parseInt(d.duree,10)||0, niveauFin:niv, kamas:kam };
    state.sessions.push(s);
    if (niv && niv > state.perso.niveau) state.perso.niveau = Math.min(200, niv);
    if (kam > 0) state.kamas.ops.push({ id:uid(), date:d.date, libelle:"Session : " + s.activite, cat:"Drops & ressources", montant:kam, from:s.id });
    toast("Session ajoutée");
  } else if (kind === "op") {
    const m = parseK(d.montant);
    if (!m) { toast("Montant invalide : écris par ex. 200k ou 1,5m"); return; }
    state.kamas.ops.push({ id:uid(), date:d.date, libelle:d.libelle.trim(), cat:d.cat, montant: m * (+d.sens) });
    toast("Opération ajoutée");
  } else if (kind === "obj") {
    state.objectifs.unshift({ id:uid(), titre:d.titre.trim(), cat:d.cat, note:d.note.trim(), fait:false });
    toast("Objectif ajouté");
  } else if (kind === "donjon") {
    const boss = d.boss.trim();
    if (allDonjons().some(x => x.boss.toLowerCase() === boss.toLowerCase())) { toast("Ce boss est déjà dans la liste"); return; }
    state.customDonjons.push({ lvl:Math.min(200, Math.max(1, parseInt(d.lvl,10)||1)), boss, donjon:"", pos:d.pos.trim(), zone:d.zone.trim() });
    toast("Donjon ajouté");
  }
  persist(); render();
});
main.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "copy") { copyText(el.dataset.v); return; }
  if (a === "dj-cycle" || a === "dj-done") {
    const k = el.dataset.k, s = djState(k);
    s.etat = a === "dj-done" ? "fait" : ({ "":"fait", fait:"succes", succes:"" }[s.etat || ""]);
    if (a === "dj-done" && !s.runs) s.runs = 1;
    state.donjons[k] = s;
  }
  else if (a === "dj-run") { const k = el.dataset.k, s = djState(k); s.runs = Math.max(0, (s.runs||0) + (+el.dataset.d)); if (s.runs > 0 && !s.etat) s.etat = "fait"; state.donjons[k] = s; }
  else if (a === "etape") { const k = el.dataset.n; if (state.parcours[k]) delete state.parcours[k]; else state.parcours[k] = today(); }
  else if (a === "dj-filter") state.ui.djEtat = el.dataset.v;
  else if (a === "obj-filter") state.ui.objCat = el.dataset.v;
  else if (a === "obj-toggle") { const o = state.objectifs.find(x => x.id === el.dataset.id); if (o) o.fait = !o.fait; }
  else if (a === "obj-del") state.objectifs = state.objectifs.filter(x => x.id !== el.dataset.id);
  else if (a === "sess-del") {
    const id = el.dataset.id;
    state.sessions = state.sessions.filter(x => x.id !== id);
    state.kamas.ops = state.kamas.ops.filter(o => o.from !== id);
  }
  else if (a === "op-del") state.kamas.ops = state.kamas.ops.filter(x => x.id !== el.dataset.id);
  else if (a === "buy") {
    const s = state.stuff.slots[+el.dataset.i];
    state.kamas.ops.push({ id:uid(), date:today(), libelle:"Achat : " + (s.vise || s.slot), cat:"Équipement", montant:-s.prix });
    s.statut = "achete"; toast("Achat enregistré : −" + shortK(s.prix));
  }
  else if (a === "upd-check") { checkUpdate(); return; }
  else if (a === "upd-install") { installUpdate(); return; }
  else if (a === "export") { copyText(JSON.stringify(state)); return; }
  else if (a === "import") {
    const raw = document.getElementById("imp").value.trim();
    try { const data = JSON.parse(raw); if (!data || !data.perso) throw 0; state = merge(data); toast("Données importées"); }
    catch(err){ toast("Texte non reconnu : colle exactement ce que tu as copié"); return; }
  }
  else if (a === "reset") {
    if (el.dataset.armed !== "1") { el.dataset.armed = "1"; el.textContent = "Clique encore pour confirmer"; setTimeout(() => { if (el.isConnected){ el.dataset.armed = ""; el.textContent = "Tout remettre à zéro"; } }, 4000); return; }
    state = defaultState(); toast("Carnet remis à zéro");
  }
  else return;
  persist(); render();
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });

render();
setSync(state.updated ? "local" : "loading");
initCloud();

/* ---------- Version bureau (Neutralino) ---------- */
(function initDesktop(){
  if (!window.Neutralino || !window.NL_PORT) return;
  let tok = window.NL_TOKEN; try { tok = tok || sessionStorage.getItem("NL_TOKEN"); } catch(e) {}
  if (!tok) return;
  try { Neutralino.init(); } catch(e) { return; }
  desktop = true;
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest('a[href^="http"]');
    if (!a) return;
    e.preventDefault();
    try { Neutralino.os.open(a.href); } catch(err) {}
  }, true);
  render();
  if (state.settings.autoUpdate) setTimeout(checkUpdate, 1500);
})();
</script>
</body>
</html>
