/* Palette : bleu nuit + or d'insigne (thème sombre par défaut), thème clair en option.
   Layout : menu latéral toujours bleu nuit + espace de travail. */
:root{
  --bg:#0b1220; --surface:#121b2e; --surface-2:#182339; --ink:#ece6d6; --muted:#9aa6bf; --line:#26324a;
  --gold:#d9b45a; --gold-soft:#3a2f12; --blue:#93b6ea; --blue-soft:#1c2a44;
  --ok:#63cf98; --ok-soft:#15301f; --warn:#f0a94a; --warn-soft:#3a2810; --bad:#f08178; --bad-soft:#3a1714;
  --on-gold:#1a1406;
  --side:#0a1420; --side-2:#13203a; --side-ink:#e9e3d2; --side-muted:#93a0b8; --side-line:#1f2c42;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-app-theme="clair"]{
  --bg:#f3efe4; --surface:#fffdf7; --surface-2:#f7f2e6; --ink:#1d2333; --muted:#5b6274; --line:#e2d9c4;
  --gold:#8a6510; --gold-soft:#f3e4bd; --blue:#23508c; --blue-soft:#dfe8f5;
  --ok:#1d7448; --ok-soft:#d9efe3; --warn:#9a5600; --warn-soft:#fbead2; --bad:#ae2a22; --bad-soft:#f8dedb;
  color-scheme: light;
}
@media (prefers-color-scheme: light){
  :root[data-app-theme="systeme"]{
    --bg:#f3efe4; --surface:#fffdf7; --surface-2:#f7f2e6; --ink:#1d2333; --muted:#5b6274; --line:#e2d9c4;
    --gold:#8a6510; --gold-soft:#f3e4bd; --blue:#23508c; --blue-soft:#dfe8f5;
    --ok:#1d7448; --ok-soft:#d9efe3; --warn:#9a5600; --warn-soft:#fbead2; --bad:#ae2a22; --bad-soft:#f8dedb;
    color-scheme: light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px}
h2{font-size:17px}
h3{font-size:15px}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,td.num,.tab{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:252px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;color-scheme:dark}
.brand{display:flex;flex-direction:column;gap:4px;align-items:center;padding:0 6px}
.brand img{width:104px;height:73px;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse at center,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse at center,#000 62%,transparent 100%)}
.brand strong{font-family:var(--display);font-size:24px;letter-spacing:.07em;display:block;line-height:1.1;color:#ecd9a4}
.brand span{font-size:12px;color:var(--side-muted)}
.brand i{display:block;width:120px;height:1px;background:linear-gradient(90deg,transparent,#d9b45a,transparent);margin-top:4px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--side-ink);font-weight:600;border:1px solid transparent}
nav a svg{flex:none;stroke:var(--side-muted)}
nav a .lbl{flex:1}
nav a:hover{background:var(--side-2)}
nav a.on{background:linear-gradient(90deg,#3a2f12,#18223a);border-color:#8a7231;color:#f3e3b3}
nav a.on svg{stroke:#d9b45a}
nav a .badge{font-size:12px;font-weight:600;color:var(--side-muted)}
nav a .badge.new{background:#d9b45a;color:#1a1406;padding:1px 8px;border-radius:99px}
nav a.on .badge{color:#ecd08a}
.sync{font-size:12px;color:var(--side-muted);display:flex;gap:6px;align-items:center;padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card > h2{margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card > h2 small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.tile .label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .big{font-size:26px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .sub{font-size:13px;color:var(--muted)}
.tile.gold{border-top:3px solid var(--gold)}
.tile.blue{border-top:3px solid var(--blue)}
.tile.ok{border-top:3px solid var(--ok)}
.tile.warn{border-top:3px solid var(--warn)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--gold);border-radius:99px}
.bar.blue > i{background:var(--blue)}
.neg{color:var(--bad)} .pos{color:var(--ok)}

.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.lvl{font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:center;padding:2px 6px;border-radius:6px;background:var(--gold-soft);color:var(--gold);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:10px 2px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:linear-gradient(180deg,#e7c46e,#c99a37);border-color:#c99a37;color:var(--on-gold)}
.btn.primary:hover{filter:brightness(1.07);color:var(--on-gold)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:26px;height:26px;line-height:1;cursor:pointer;font-weight:700}
.icon-btn:hover{border-color:var(--blue);color:var(--blue)}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.pill.st-fait{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.st-succes{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
.form{display:grid;gap:12px;align-items:end}
.form.f5{grid-template-columns:1.1fr 2fr 1.2fr 1fr auto}
.form.f6{grid-template-columns:1fr 2fr .8fr .8fr 1fr auto}
.form.f4{grid-template-columns:2fr 1fr 2fr auto}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td .sub{display:block;font-size:12px;color:var(--muted)}
tr.here td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tr.done td{color:var(--muted)}
tr.done td strong{text-decoration:line-through;text-decoration-color:var(--line)}
td input[type=text]{padding:5px 8px;font-size:13px}
td.runs{white-space:nowrap}
td.runs span{display:inline-block;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.posbtn{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.posbtn:hover{border-color:var(--gold);color:var(--gold)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters label.f{min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 12px;font-weight:600;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--blue-soft);color:var(--blue)}

.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hbar .track i{display:block;height:100%;background:var(--blue)}
.hbar .track i.out{background:var(--bad)}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums}

.chart svg{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--line)}
.chart .grid-l{stroke:var(--line);stroke-dasharray:3 4}
.chart .line{fill:none;stroke:var(--gold);stroke-width:2.5}
.chart .area{fill:var(--gold-soft);opacity:.7}
.chart .pt{fill:var(--surface);stroke:var(--gold);stroke-width:2}
.chart .pt.last{fill:var(--gold)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

.calc-out{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.calc-out div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.calc-out b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.calc-out span{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.note{font-size:12px;color:var(--muted);margin-top:10px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

.steps .step{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.steps .step input{margin-top:4px}
.steps .step.done{opacity:.7}
.steps .step.done .t{text-decoration:line-through;text-decoration-color:var(--muted)}
.step-h{display:block;cursor:pointer;margin-bottom:6px}
.step-n{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-right:4px}
.step .t{font-weight:700}
.step .s{margin:6px 0 0;font-size:13px;color:var(--muted)}
.step .s b{color:var(--ink);font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums}
a.dchip:hover{border-color:var(--blue);color:var(--blue)}
.dchip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.guide-link{font-size:13px;font-weight:600;white-space:nowrap}
.elem{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.elem div{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px}
.elem b{display:block;color:var(--ink)}
.elem span{color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.links a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:var(--surface-2)}
.links a b{display:block;color:var(--ink)}
.links a span{font-size:12px;color:var(--muted)}
.links a:hover{border-color:var(--blue)}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form.f5,.form.f6{grid-template-columns:1fr 1fr}
  .form.f4{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:5;padding:10px 12px;gap:8px;border-right:none;border-bottom:1px solid var(--line)}
  .brand span{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  nav a{white-space:nowrap;padding:6px 10px}
  nav a .badge{display:none}
  .sync{margin-top:0}
  .g2,.g3{grid-template-columns:1fr}
  .calc-out{grid-template-columns:1fr}
  .hbar{grid-template-columns:110px 1fr 90px}
  .links{grid-template-columns:1fr}
  h1{font-size:23px}
}
@media (max-width:420px){
  .g4{grid-template-columns:1fr}
  .form.f5,.form.f6,.form.f4{grid-template-columns:1fr}
}

/* ---- 1.2.0 : équipe, accueil, paramètres, parcours ---- */
.team-side{margin-top:auto;border-top:1px solid var(--side-line);padding:14px 6px 2px;display:flex;flex-direction:column;gap:8px}
.team-side .ttl{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px}
.team-side select{background:var(--side-2);border:1px solid var(--side-line);color:var(--side-ink);border-radius:8px;padding:7px 9px;width:100%}
.team-side .sub{font-size:12px;color:#d9b45a}
.hero{border-radius:16px;border:1px solid var(--line);padding:32px 32px 30px;margin-bottom:22px;background-color:#0b1220;background-image:linear-gradient(90deg,#0b1220 0%,rgba(11,18,32,.94) 40%,rgba(11,18,32,.3) 78%,rgba(11,18,32,.55) 100%),var(--hero-img);background-size:cover;background-position:right center;color:#ece6d6}
.hero .eyebrow{color:#d9b45a}
.hero h1{font-size:38px;color:#f4ecd8;line-height:1.1}
.hero p.lead{color:#c9cfdc;margin:10px 0 20px}
.kpi{display:flex;align-items:center;gap:14px;padding:16px 18px}
.kpi svg{flex:none;stroke:var(--gold)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);margin-top:3px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:left;cursor:pointer;width:100%}
.pcard:hover{border-color:var(--gold)}
.pcard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.crest{flex:none;width:52px;height:62px;border-radius:8px 8px 26px 26px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:20px;color:#fff;border:2px solid #d9b45a;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pcard .nm{font-weight:700}
.pcard .cl{font-size:13px;color:var(--muted)}
.lvlpill{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
.addp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:86px;border-radius:12px;background:transparent;border:1px dashed var(--line);color:var(--muted);cursor:pointer}
.addp:hover{border-color:var(--gold);color:var(--gold)}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme-opt{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface-2);color:var(--ink)}
.theme-opt.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.theme-opt .sw{height:38px;border-radius:8px;border:1px solid rgba(0,0,0,.15)}
.theme-opt b{font-size:14px}
.theme-opt span{font-size:12px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop.over{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.drop b{display:block;color:var(--ink);margin-bottom:2px}
.danger-zone{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger-solid{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.danger-solid:hover{background:var(--bad-soft)}
.track{display:flex;align-items:center;flex-wrap:wrap;gap:0;row-gap:16px;padding:6px 2px}
.jal{display:flex;align-items:center}
.jal .node{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.jal .node.done{background:var(--ok);border-color:var(--ok);color:#0b1220}
.jal .node.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.jal .node.opt{border-style:dashed}
.jal .link{width:26px;height:0;border-top:2px dashed var(--line)}
.jal .link.done{border-top-style:solid;border-top-color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:inline-block}
@media (max-width:760px){ .themes{grid-template-columns:1fr} .hero h1{font-size:28px} .team-side{margin-top:0} }
:root[data-density="compact"] .card{padding:14px}
:root[data-density="compact"] .row{padding-top:7px;padding-bottom:7px}
:root[data-motion="reduced"] *, :root[data-motion="reduced"] *::before, :root[data-motion="reduced"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.field-prefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.obj-progress{margin-top:7px;max-width:300px}
.source-date{font-size:12px;color:var(--muted)}

/* 1.4.1 : menu regroupé */
.nav-group{margin:2px 0}
.nav-head{width:100%;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);border-radius:8px;text-align:left}
.nav-head::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.nav-head[aria-expanded="false"]::after{transform:rotate(-45deg)}
.nav-head:hover{color:var(--side-ink)}
.nav-head:focus-visible{outline:2px solid #d9b45a;outline-offset:1px}
.nav-items{display:flex;flex-direction:column;gap:2px}
.nav-items[hidden]{display:none}
.nav-count{font-weight:600;letter-spacing:0;opacity:.7}
.nav-sep{height:1px;background:var(--side-line);margin:8px 8px}
@media (prefers-reduced-motion: reduce){.nav-head::after{transition:none}}
</style>
</head>
<body>
<div class="app">

function levelChart(){
  const pts = state.sessions.filter(s => s.niveauFin).slice().sort((a,b) => (a.date||"").localeCompare(b.date||""));
  if (pts.length < 2) return `<p class="empty">Le graphique apparaît après 2 sessions enregistrées.</p>`;
  const W = 640, H = 200, L = 36, R = 14, T = 14, B = 26;
  const lv = pts.map(p => p.niveauFin), mn = Math.min(...lv) - 1, mx = Math.max(...lv) + 1;
  const x = i => L + (W-L-R) * (pts.length === 1 ? 0 : i/(pts.length-1));
  const y = v => T + (H-T-B) * (1 - (v-mn)/(mx-mn));
  const line = pts.map((p,i) => `${x(i).toFixed(1)},${y(p.niveauFin).toFixed(1)}`).join(" ");
  const area = `${L},${H-B} ${line} ${x(pts.length-1).toFixed(1)},${H-B}`;
  const ticks = [mn+1, Math.round((mn+mx)/2), mx-1].filter((v,i,a) => a.indexOf(v) === i);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du niveau par session">
    ${ticks.map(t => `<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join("")}
    <line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    <polygon class="area" points="${area}"/><polyline class="line" points="${line}"/>
    ${pts.map((p,i) => `<circle class="pt ${i===pts.length-1?"last":""}" cx="${x(i)}" cy="${y(p.niveauFin)}" r="${i===pts.length-1?5:3.5}"/>`).join("")}
    <text x="${L}" y="${H-8}">${esc(pts[0].date)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${esc(pts[pts.length-1].date)}</text>
  </svg></div>`;
}

function vDonjons(){
  const u = state.ui, n = state.perso.niveau, all = allDonjons(), q = (u.djQ||"").toLowerCase().trim();
  const tranches = [["moi",`Mon niveau (${Math.max(1,n-10)}–${Math.min(200,n+10)})`],["tous","Tous"],["1-50","1–50"],["51-100","51–100"],["101-150","101–150"],["151-200","151–200"]];
  const list = all.filter(d => {
    if (u.djTranche === "moi" && !aMonNiveau(d)) return false;
    if (/^\d+-\d+$/.test(u.djTranche)) { const [a,b] = u.djTranche.split("-").map(Number); if (d.lvl < a || d.lvl > b) return false; }
    const st = djState(d.boss).etat;
    if (u.djEtat === "afaire" && st) return false;
    if (u.djEtat === "fait" && !st) return false;
    if (q && !(d.boss + " " + d.donjon + " " + d.zone).toLowerCase().includes(q)) return false;

  const faits = all.filter(d => djState(d.boss).etat).length, succes = all.filter(d => djState(d.boss).etat === "succes").length;

    <div class="table-wrap"><table><thead><tr><th>Niv.</th><th>Boss / donjon</th><th>Position</th><th>État</th><th>Passages</th><th style="min-width:180px">Note (drops, astuces)</th><th>Guide</th></tr></thead><tbody id="dj-body">
      ${list.length ? list.map(d => { const s = djState(d.boss); return `
      <tr class="${aMonNiveau(d)?"here":""} ${s.etat?"done":""}">
        <td class="num"><span class="lvl">${d.lvl}</span></td>
        <td><strong>${esc(d.boss)}</strong>${(d.donjon||d.zone||d.custom)?`<span class="sub">${esc([d.donjon,d.zone].filter(Boolean).join(" · "))}${d.custom?" (ajouté par toi)":""}</span>`:""}${dungeonReference(d)}${d.custom?`<button class="btn small ghost danger" data-act="custom-del" data-k="${esc(d.boss)}">Retirer ce donjon</button>`:''}</td>

function vKamas(){

  const byCat = {}; k.ops.forEach(o => { byCat[o.cat] = byCat[o.cat] || {g:0,d:0}; if (o.montant > 0) byCat[o.cat].g += o.montant; else byCat[o.cat].d -= o.montant; });
  const cats = Object.entries(byCat).map(([c,v]) => ({c, g:v.g, d:v.d})).sort((a,b) => (b.g+b.d)-(a.g+a.d));
  const max = Math.max(1, ...cats.map(x => Math.max(x.g, x.d)));
  const ops = k.ops.slice().sort((a,b) => (b.date||"").localeCompare(a.date||"") || 0);

function cmpVer(a,b){ const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i=0;i<3;i++){ const d=(x[i]||0)-(y[i]||0); if (d) return d>0?1:-1; } return 0; }
async function checkUpdate(){
  if (!desktop) return;
  upd = { state:"checking", info:null, err:"" }; refreshUpd();
  try {
    const m = await Neutralino.updater.checkForUpdates(UPDATE_URL);
    const newer = m && m.version && cmpVer(m.version, curVersion()) > 0;
    // Une version qui change aussi Escouade.exe ou l'Organisateur ne peut pas s'installer par le seul fichier de ressources :
    // le manifeste l'indique avec data.requiresFullPackage et donne le lien du paquet complet (data.packageUrl, https).
    const full = newer && m.data && m.data.requiresFullPackage;
    upd = full ? { state:"full", info:m, err:"" } : newer ? { state:"available", info:m, err:"" } : { state:"uptodate", info:m, err:"" };
  } catch(e){ upd = { state:"error", info:null, err:(e && (e.message || e.code)) || "inconnue" }; }
  refreshUpd();
}
async function installUpdate(){
  if (!desktop || upd.state !== "available") return;

function armed(el, label){
  if (el.dataset.armed === "1") return true;

  setTimeout(() => { if (el.isConnected){ el.dataset.armed = ""; el.textContent = label; } }, 4000);

function validSave(d){
  const obj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
  const num = v => v === undefined || v === '' || (typeof v === 'number' && Number.isFinite(v) && Math.abs(v) <= Number.MAX_SAFE_INTEGER);
  const text = v => v === undefined || (typeof v === 'string' && v.length <= 200000);
  const list = (v, check) => v === undefined || (Array.isArray(v) && v.length <= 10000 && v.every(x => obj(x) && check(x)));
  function safe(value, depth=0){
    if(depth > 20) return false;
    if(value === null || typeof value !== 'object') return typeof value !== 'string' || value.length <= 200000;
    return Object.entries(value).every(([k,v]) => !['__proto__','prototype','constructor'].includes(k) &&
      (k !== 'id' || (typeof v === 'string' && /^[a-zA-Z0-9_-]{1,80}$/.test(v))) && safe(v,depth+1));
  }
  function person(p){
    if(!obj(p)) return false;
    if(!validGuide(p.guide))return false;
    if(p.perso !== undefined && (!obj(p.perso) || !['nom','serveur','classe','element'].every(k=>text(p.perso[k])) || !['niveau','objectif'].every(k=>num(p.perso[k]) && (p.perso[k] === undefined || p.perso[k] === '' || (Number.isInteger(p.perso[k]) && p.perso[k]>=1 && p.perso[k]<=200))))) return false;
    if(p.xp !== undefined && (!obj(p.xp) || !['courante','prochain','parCombat','minCombat'].every(k=>num(p.xp[k]) && !(p.xp[k]<0)))) return false;
    if(!list(p.sessions,s=>['date','activite'].every(k=>text(s[k])) && ['duree','niveauFin','kamas'].every(k=>s[k] === null || num(s[k])))) return false;
    if(p.donjons !== undefined && (!obj(p.donjons) || !Object.values(p.donjons).every(x=>obj(x) && text(x.note) && num(x.runs) && !(x.runs<0) && [undefined,'','fait','succes'].includes(x.etat)))) return false;
    if(p.parcours !== undefined && (!obj(p.parcours) || !Object.values(p.parcours).every(x=>typeof x==='string' || typeof x==='boolean'))) return false;
    if(p.dofus !== undefined && (!obj(p.dofus) || !Object.values(p.dofus).every(x=>typeof x==='boolean'))) return false;
    if(p.perso && (!text(p.perso.role) || (p.perso.parcoursDepart!==undefined && !PARCOURS.some(e=>e.n===p.perso.parcoursDepart)))) return false;
    if(p.stuff !== undefined && (!obj(p.stuff) || !list(p.stuff.slots,s=>['slot','actuel','vise','statut'].every(k=>text(s[k])) && num(s.prix) && !(s.prix<0)) || (p.stuff.caracs !== undefined && (!obj(p.stuff.caracs) || !Object.values(p.stuff.caracs).every(c=>obj(c) && num(c.a) && num(c.v)))))) return false;
    return true;
  }
  if(!obj(d) || !safe(d) || (d.v !== undefined && ![1,2,3].includes(d.v))) return false;
  if(!validWorkshop(d.workshop))return false;
  if(d.persos !== undefined){
    if(!Array.isArray(d.persos) || !d.persos.length || d.persos.length>MAX_PERSOS || !d.persos.every(person)) return false;
    const ids=d.persos.map(p=>p.id).filter(Boolean); if(new Set(ids).size!==ids.length) return false;
  } else if(!obj(d.perso) || !person(d)) return false;
  if(d.kamas !== undefined && (!obj(d.kamas) || !num(d.kamas.depart) || !list(d.kamas.ops,o=>num(o.montant) && text(o.libelle) && text(o.date) && text(o.cat)))) return false;
  if(!list(d.objectifs,o=>text(o.titre) && text(o.cat) && text(o.note) && text(o.unite) && num(o.cible) && num(o.avancement))) return false;
  if(!list(d.customDonjons,x=>typeof x.boss==='string' && num(x.lvl) && text(x.zone) && text(x.pos))) return false;
  if(d.notes !== undefined && (!obj(d.notes) || !['build','combos','boss'].every(k=>text(d.notes[k])))) return false;
  if(d.settings !== undefined && (!obj(d.settings) || (d.settings.theme !== undefined && !['clair','sombre','systeme'].includes(d.settings.theme)) || (d.settings.autoUpdate !== undefined && typeof d.settings.autoUpdate!=='boolean') || (d.settings.textSize!==undefined && ![90,100,110,125].includes(d.settings.textSize)) || (d.settings.startPage!==undefined && !TABS.some(t=>t[0]===d.settings.startPage)) || (d.settings.density!==undefined && !['compact','confort'].includes(d.settings.density)) || (d.settings.reducedMotion!==undefined && typeof d.settings.reducedMotion!=='boolean'))) return false;
  if(d.ui !== undefined && (!obj(d.ui) || !['djTranche','djEtat','djQ','objCat'].every(k=>text(d.ui[k])))) return false;
  if(d.settings?.navClosed!==undefined&&(!obj(d.settings.navClosed)||!Object.entries(d.settings.navClosed).every(([k,v])=>['Suivi','Outils de jeu'].includes(k)&&typeof v==='boolean')))return false;
  if(d.outils!==undefined && (!obj(d.outils) || !['croquettePrix','xpFamilier','statCible'].every(k=>num(d.outils[k]) && !(d.outils[k]<0)))) return false;
  return true;
}
function importText(raw){
  if(String(raw||'').length>5e6){toast('Sauvegarde trop volumineuse (limite : 5 Mo)');return false;}
  let data = null; try { data = JSON.parse(String(raw || "").trim()); } catch(e){}
  if (!validSave(data)) { toast("Fichier ou texte non reconnu : utilise une sauvegarde exportée par Escouade"); return false; }
  let next; try { next = merge(data); } catch(e){ toast("Sauvegarde invalide : aucune donnée modifiée"); return false; }
  if(!saveBackup("avant import")) return false;
  state = next; loadNotice=''; persist(); render();
  toast("Sauvegarde importée (" + state.persos.length + " perso" + (state.persos.length>1?"s":"") + "). L'ancienne est gardée dans Paramètres.");
  return true;
}
function importFile(file){
  if (!file) return;
  if (file.size > 5e6) { toast("Fichier trop gros pour une sauvegarde Escouade"); return; }
  const r = new FileReader(); r.onload = () => importText(r.result); r.onerror = () => toast("Lecture du fichier impossible"); r.readAsText(file);
}
async function exportFile(){
  const json = JSON.stringify(state, null, 2), name = "escouade-sauvegarde-" + today() + ".json";
  return saveTextFile(json,name);
}
async function saveTextFile(json,name){
  if (desktop) {
    try {
      const path = await Neutralino.os.showSaveDialog("Exporter la sauvegarde Escouade", { defaultPath: (window.NL_PATH?window.NL_PATH+'/':'')+name, filters:[{ name:"Sauvegarde Escouade", extensions:["json"] }] });
      if (!path) return;
      await Neutralino.filesystem.writeFile(/\.json$/i.test(path) ? path : path + ".json", json);
      toast("Sauvegarde exportée"); return;
    } catch(e){ toast("Export impossible : " + ((e && (e.message || e.code)) || "erreur")); return; }
  }
  downloadText(json,name);
}
function downloadText(text,name){
  const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Fichier de sauvegarde préparé');
}

/* ---------- Événements ---------- */
const main = document.getElementById("main");
function coerce(el, raw){
  const t = el.dataset.type;
  if (t === "bool") return !!el.checked;
  if (t === "int") return raw === "" ? "" : (parseInt(raw,10) || 0);
  if (t === "float") return parseFloat(String(raw).replace(",", ".")) || 0;
  if (t === "k") return parseK(raw);
  return raw;
}
main.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.djnote !== undefined) {
    const k = el.dataset.djnote; state.donjons[k] = Object.assign(djState(k), { note: el.value }); persist(); return;
  }
  if (!el.dataset.bind || el.dataset.live) return;
  let v = coerce(el, el.value);
  if (el.dataset.bind === "perso.niveau" || el.dataset.bind === "perso.objectif") v = Math.min(200, Math.max(1, v || 1));
  if(el.dataset.bind==='perso.parcoursDepart') v=PARCOURS.some(e=>e.n===v)?v:1;
  if(/^(xp\.|outils\.|stuff\.slots\.\d+\.prix)/.test(el.dataset.bind)) v=Math.max(0,Number(v)||0);
  if(el.dataset.bind==='outils.statCible') v=Math.min(1000,v);
  if(/^objectifs\.\d+\.(cible|avancement)$/.test(el.dataset.bind)) v=Math.max(0,Number(v)||0);
  if(/^objectifs\.\d+\.titre$/.test(el.dataset.bind) && !String(v).trim()){ toast('Le titre ne peut pas être vide'); render(); return; }
  setPath(state, el.dataset.bind, v);
  if(/^objectifs\.\d+\.(cible|avancement)$/.test(el.dataset.bind)){ const o=state.objectifs[Number(el.dataset.bind.split('.')[1])]; if(o.cible>0) o.fait=(o.avancement||0)>=o.cible; }
  persist(); render();
});
main.addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset.bind || !el.dataset.live) return;
  setPath(state, el.dataset.bind, el.value);
  if (el.dataset.live === "search") {
    clearTimeout(main._q); main._q = setTimeout(() => { persist(); render(); const q = document.getElementById("dj-q"); if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250);
  } else { persist(); }
});
main.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  const kind = f.dataset.form;
  if (kind === "session") {
    const kam = parseK(d.kamas), niv = parseInt(d.niveauFin,10) || null;
    if (!d.activite.trim() || kam < 0 || (d.kamas.trim() && !kam && d.kamas.trim() !== '0')) { toast("Vérifie l'activité et les kamas gagnés (montant positif ou nul)."); return; }
    const s = { id:uid(), date:d.date, activite:d.activite.trim(), duree:parseInt(d.duree,10)||0, niveauFin:niv, kamas:kam };
    state.sessions.push(s);
    if (niv && niv > state.perso.niveau) state.perso.niveau = Math.min(200, niv);
    if (kam > 0) state.kamas.ops.push({ id:uid(), date:d.date, libelle:"Session (" + persoLabel(activeP()) + ") : " + s.activite, perso:state.activeId, cat:"Drops & ressources", montant:kam, from:s.id });
    toast("Session ajoutée");
  } else if (kind === "op") {
    const m = parseK(d.montant);
    if (!(m > 0)) { toast("Montant positif attendu : écris par ex. 200k ou 1,5m, puis choisis Gain ou Dépense"); return; }
    state.kamas.ops.push({ id:uid(), date:d.date, libelle:d.libelle.trim(), cat:d.cat, montant: m * (+d.sens) });
    toast("Opération ajoutée");
  } else if (kind === "obj") {
    if(!d.titre.trim()){ toast("Donne un titre à ton objectif"); return; }
    const cible=Math.max(0,parseK(d.cible));
    state.objectifs.unshift({ id:uid(), titre:d.titre.trim(), cat:d.cat, note:d.note.trim(), fait:false, cible, avancement:0, unite:(d.unite||'').trim() });
    toast("Objectif ajouté");
  } else if (kind === "donjon") {
    const boss = d.boss.trim();
    if(!boss || ['__proto__','constructor','prototype'].includes(boss)){ toast("Nom de boss invalide"); return; }
    if (allDonjons().some(x => x.boss.toLowerCase() === boss.toLowerCase())) { toast("Ce boss est déjà dans la liste"); return; }
    state.customDonjons.push({ lvl:Math.min(200, Math.max(1, parseInt(d.lvl,10)||1)), boss, donjon:"", pos:d.pos.trim(), zone:d.zone.trim() });
    toast("Donjon ajouté");
  }
  persist(); render();
});
main.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "copy") { copyText(el.dataset.v); return; }
  if (a === "dj-cycle" || a === "dj-done") {
    const k = el.dataset.k, s = djState(k);
    s.etat = a === "dj-done" ? "fait" : ({ "":"fait", fait:"succes", succes:"" }[s.etat || ""]);
    if (a === "dj-done" && !s.runs) s.runs = 1;
    state.donjons[k] = s;
  }
  else if (a === "dj-run") { const k = el.dataset.k, s = djState(k); s.runs = Math.max(0, (s.runs||0) + (+el.dataset.d)); if (s.runs > 0 && !s.etat) s.etat = "fait"; state.donjons[k] = s; }
  else if (a === "etape") { const k = el.dataset.n; if (state.parcours[k]) delete state.parcours[k]; else state.parcours[k] = today(); }
  else if (a === "dj-filter") state.ui.djEtat = el.dataset.v;
  else if (a === "obj-filter") state.ui.objCat = el.dataset.v;
  else if (a === "obj-toggle") { const o = state.objectifs.find(x => x.id === el.dataset.id); if (o) o.fait = !o.fait; }
  else if (a === "dofus-toggle") { if(ESCOUADE_CONTENT.dofus.some(d=>d.nom===el.dataset.name)) state.dofus[el.dataset.name]=!!el.checked; }
  else if (a === "obj-suggest") { const n = addSuggestions(activeP()); toast(n ? n + " objectif" + (n>1?"s":"") + " ajouté" + (n>1?"s":"") + " pour " + persoLabel(activeP()) : "Aucune nouvelle suggestion"); }
  else if (a === "obj-del") state.objectifs = state.objectifs.filter(x => x.id !== el.dataset.id);
  else if (a === "sess-del") {
    const id = el.dataset.id;
    state.sessions = state.sessions.filter(x => x.id !== id);
    state.kamas.ops = state.kamas.ops.filter(o => o.from !== id);
  }
  else if (a === "op-del") state.kamas.ops = state.kamas.ops.filter(x => x.id !== el.dataset.id);
  else if (a === "op-page") state.ui.kPage=Math.max(1,Number(el.dataset.page)||1);
  else if (a === "custom-del") {
    if(!armed(el,'Retirer ce donjon') || !saveBackup('avant suppression de donjon')) return;
    state.customDonjons=state.customDonjons.filter(d=>d.boss!==el.dataset.k);
    state.persos.forEach(p=>{delete p.donjons[el.dataset.k];});
  }
  else if (a === "buy") {
    const s = state.stuff.slots[+el.dataset.i];
    if (!s || s.statut !== 'acheter' || !(s.prix > 0)) return;
    state.kamas.ops.push({ id:uid(), date:today(), libelle:"Achat (" + persoLabel(activeP()) + ") : " + (s.vise || s.slot), cat:"Équipement", montant:-s.prix, perso:state.activeId });
    s.statut = "achete"; toast("Achat enregistré : −" + shortK(s.prix));
  }
  else if (a === "upd-check") { checkUpdate(); return; }
  else if (a === "upd-install") { installUpdate(); return; }
  else if (a === "export") { copyText(JSON.stringify(state)); return; }
  else if (a === "export-file") { exportFile(); return; }
  else if (a === "recover-raw") {
    let raw=unsafeOriginal; try { raw=raw || localStorage.getItem(LS_KEY+'-recovery'); } catch(e){}
    if(raw) await saveTextFile(raw,'escouade-recuperation-originale.json'); else toast('Aucune copie non reconnue disponible');
    return;
  }
  else if (a === "import") { if (importText(document.getElementById("imp").value)) return; else return; }
  else if (a === "reset") {
    if (!armed(el, "Réinitialiser les données")) return;
    if(!saveBackup("avant réinitialisation")) return; state = defaultState(); toast("Données réinitialisées. Une copie est gardée dans Paramètres.");
  }
  else if (a === "restore") {
    if (!armed(el, "Restaurer la copie")) return;
    const bk = readBackup(); if (!bk) return;
    const cur = JSON.parse(JSON.stringify(state));
    state = merge(bk.data);
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify({ at: Date.now(), reason:"avant restauration", data: cur })); } catch(e){}
    toast("Copie restaurée");
  }
  else if (a === "theme") state.settings.theme = el.dataset.v;
  else if (a === "perso-pick") { state.activeId = el.dataset.id; toast(persoLabel(activeP()) + " sélectionné"); }
  else if (a === "perso-add") { if(!addPerso()) return; toast("Perso ajouté : choisis sa classe et son niveau"); persist(); location.hash = "progression"; render(); return; }
  else if (a === "perso-del") {
    if (state.persos.length < 2 || !armed(el, "Supprimer ce perso")) return;
    if(!saveBackup("avant suppression de " + persoLabel(activeP()))) return;
    const id = state.activeId; state.persos = state.persos.filter(q => q.id !== id); state.activeId = state.persos[0].id;
    toast("Perso supprimé. Une copie est gardée dans Paramètres.");
  }
  else return;
  persist(); render();
});
document.addEventListener("click", e => {
  const h = e.target.closest && e.target.closest(".nav-head"); if (!h) return;
  const name = h.dataset.group, closed = Object.assign({}, state.settings.navClosed || {});
  if (h.getAttribute("aria-expanded") === "true") closed[name] = true; else delete closed[name];
  state.settings.navClosed = closed; persist(); renderNav();
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });
main.addEventListener("change", e => { if (e.target.id === "imp-file") { importFile(e.target.files && e.target.files[0]); e.target.value = ""; } });
main.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (!d) return; e.preventDefault(); d.classList.add("over"); });
main.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
main.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); importFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); });
document.addEventListener("change", e => { if (e.target.id === "perso-switch") { state.activeId = e.target.value; persist(); render(); } });

installGuideEvents();
installScanEvents();
installBankEvents();
installWidgetEvents();
if(!location.hash && TABS.some(t=>t[0]===state.settings.startPage)) history.replaceState(null,'','#'+state.settings.startPage);
render();
setSync(state.updated ? "local" : "loading");
if(!IS_WIDGET)initCloud();

/* ---------- Version bureau (Neutralino) ---------- */
(function initDesktop(){
  let tries=0;
  function connect(){
  if (!window.Neutralino || !window.NL_PORT) { if(++tries<100) setTimeout(connect,100); return; }
  let tok = window.NL_TOKEN; try { tok = tok || sessionStorage.getItem("NL_TOKEN"); } catch(e) {}
  if (!tok) { if(++tries<100) setTimeout(connect,100); return; }
  try { Neutralino.init(); } catch(e) { window.ESCOUADE_BRIDGE_ERROR=e.message; return; }
  desktop = true;
  if(IS_WIDGET)Neutralino.window.setAlwaysOnTop(widgetTop).catch(()=>{widgetTop=false;render();});
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest('a[href^="http"]');
    if (!a) return;
    e.preventDefault();
    Promise.resolve().then(()=>Neutralino.os.open(a.href)).catch(()=>toast("Impossible d'ouvrir le navigateur. Copie le lien pour l'ouvrir manuellement."));
  }, true);
  render();
  if (!IS_WIDGET && state.settings.autoUpdate) setTimeout(checkUpdate, 1500);
  }
  connect();
})();
</script>
